[pytest]
testpaths = tests middleware/tests
addopts = -q
markers =
    rdma: needs an RDMA device (SoftRoCE rxe0 or ConnectX); skipped when none is present
    cluster: needs two nodes; run from the notebooks with MODE="cluster"
    slow: longer than a few seconds
    gpu: needs a CUDA GPU (torch.cuda.is_available()); skipped otherwise
